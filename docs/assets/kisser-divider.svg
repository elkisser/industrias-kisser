<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#146B38" />
      <stop offset="50%" stop-color="#DF9F14" />
      <stop offset="100%" stop-color="#146B38" />
    </linearGradient>
    <style>
      .shine {
        animation: sweep 5s ease-in-out infinite;
      }
      @keyframes sweep {
        0% { transform: translateX(-200px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
    </style>
  </defs>
  <rect x="0" y="10" width="1200" height="4" rx="2" fill="#2E322E" />
  <rect x="0" y="10" width="1200" height="4" rx="2" fill="url(#barGrad)" opacity="0.85" />
  <rect x="0" y="8" width="160" height="8" rx="4" fill="#DF9F14" class="shine" />
</svg>
