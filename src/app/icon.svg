      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(30)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(60)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(90)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(120)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(150)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(180)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(210)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(240)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(270)" />
