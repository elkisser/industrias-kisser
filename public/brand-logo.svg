<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9E7DF" />
      <stop offset="100%" stop-color="#DAD7CB" />
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5E605D" />
      <stop offset="50%" stop-color="#4D4F4C" />
      <stop offset="100%" stop-color="#3F413E" />
    </linearGradient>
    <linearGradient id="bannerFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFCF8" />
      <stop offset="100%" stop-color="#F2F0E6" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Fondo cuadrado suavizado -->
  <rect width="512" height="512" rx="72" fill="url(#bgPlate)" />

  <!-- Escudo Hexagonal con triple filete (fiel al emblema original Kisser, vectorizado en alta definición) -->
  <g filter="url(#softShadow)">
    <!-- Hexágono exterior oscuro -->
    <polygon
      points="256,24 446,130 446,382 256,488 66,382 66,130"
      fill="#FBF9F3"
      stroke="#2D2F2D"
      stroke-width="8"
      stroke-linejoin="round"
    />
    <!-- Cuerpo hexagonal gris acero con borde oscuro -->
    <polygon
      points="256,42 430,140 430,372 256,470 82,372 82,140"
      fill="url(#hexFill)"
      stroke="#2D2F2D"
      stroke-width="7"
      stroke-linejoin="round"
    />
    <!-- Filete hexagonal interno claro -->
    <polygon
      points="256,60 414,149 414,363 256,452 98,363 98,149"
      fill="none"
      stroke="#FBF9F3"
      stroke-width="6"
      stroke-linejoin="round"
    />
  </g>

  <!-- Engranaje Superior Kisser 360° (12 dientes tallados con precisión) -->
  <g transform="translate(256, 128)">
    <!-- 12 Dientes trapezoidales -->
    <g fill="#FBF9F3">
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(0)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(30)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(60)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(90)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(120)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(150)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(180)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(210)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(240)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(270)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(300)" />
      <rect x="-6" y="-39" width="12" height="14" rx="2" transform="rotate(330)" />
    </g>
    <!-- Corona del engranaje -->
    <circle cx="0" cy="0" r="29" fill="#FBF9F3" />
    <!-- Centro calado del engranaje -->
    <circle cx="0" cy="0" r="17" fill="#525451" stroke="#2D2F2D" stroke-width="2" />
  </g>

  <!-- Placa / Cinta Horizontal Central que cruza el hexágono -->
  <g filter="url(#softShadow)">
    <rect
      x="30"
      y="188"
      width="452"
      height="146"
      rx="6"
      fill="url(#bannerFill)"
      stroke="#2D2F2D"
      stroke-width="8"
    />
    <rect
      x="40"
      y="198"
      width="432"
      height="126"
      rx="3"
      fill="none"
      stroke="#C8C4B7"
      stroke-width="2"
    />
  </g>

  <!-- Tipografía "INDUSTRIAS" -->
  <text
    x="256"
    y="241"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="31"
    letter-spacing="6"
    fill="#2B2D2B"
  >
    INDUSTRIAS
  </text>

  <!-- Tipografía "KISSER" en bloque industrial pesado -->
  <text
    x="256"
    y="309"
    text-anchor="middle"
    font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif"
    font-weight="900"
    font-size="68"
    letter-spacing="5"
    fill="#1E201E"
  >
    KISSER
  </text>
</svg>
